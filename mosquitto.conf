persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
per_listener_settings true

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/password_file

listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/password_file
